<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suporte | Advocacia Escalável</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
  --ae-gradiente: linear-gradient(90deg, #2B2B6E 0%, #FF038F 100%);
  --ae-gradiente-diagonal: linear-gradient(135deg, #2B2B6E 0%, #FF038F 100%);
  --ae-font: "Geologica", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  --ae-radius-lg: 16px; --ae-radius: 12px; --ae-radius-sm: 8px;
}
:root, [data-tema="claro"] {
  --ae-bg: #F6F5FA; --ae-surface: #FFFFFF; --ae-surface-2: #EFEDF6; --ae-surface-3: #E7E4F2;
  --ae-border: #E1DEEE; --ae-border-strong: #C9C4F5;
  --ae-text: #2E294F; --ae-text-soft: #5B5878; --ae-text-faint: #6B6885;
  --ae-brand: #2B2B6E; --ae-pink: #FF038F; --ae-pink-ink: #C70070; --ae-pink-soft: #FFE6F3;
  --ae-action: #C70070; --ae-action-hover: #A80260; --ae-action-ink: #FFFFFF;
  --ae-success: #147A5C; --ae-success-soft: #E3F4EE;
  --ae-warn: #8B5A00; --ae-warn-soft: #FCF1DC;
  --ae-danger: #B23A20; --ae-danger-soft: #FBEAE5;
  --ae-info: #534C8C; --ae-info-soft: #ECEAF8;
  --ae-shadow-1: 0 1px 2px rgba(43,43,110,.06), 0 1px 3px rgba(43,43,110,.05);
  --ae-shadow-2: 0 6px 18px rgba(43,43,110,.12);
  --ae-shadow-pop: 0 12px 32px rgba(43,43,110,.18);
  --ae-logo-ink: #2B2B6E; --ae-produto: #534C8C;
  /* tons das etiquetas de tipo: fundo suave + texto escuro (todos acima de 7:1) */
  --t0-bg: #ECEAF8; --t0-ink: #3F3978;
  --t1-bg: #FFE4CF; --t1-ink: #7A3D00;
  --t2-bg: #FFE6F3; --t2-ink: #9C0058;
  --t3-bg: #E3F4EE; --t3-ink: #0F5F48;
  --t4-bg: #FCF3CC; --t4-ink: #6B4A00;
  --t5-bg: #E4EEFB; --t5-ink: #1F4A82;
  color-scheme: light;
}
[data-tema="escuro"] {
  --ae-bg: #171428; --ae-surface: #211E39; --ae-surface-2: #2A2647; --ae-surface-3: #3A3460;
  --ae-border: #3D3862; --ae-border-strong: #534C8C;
  --ae-text: #F3F1F8; --ae-text-soft: #B7B4C8; --ae-text-faint: #9895B0;
  --ae-brand: #C9C4F5; --ae-pink: #FF038F; --ae-pink-ink: #FF69B8; --ae-pink-soft: rgba(255,3,143,.18);
  --ae-action: #FF69B8; --ae-action-hover: #FF8CC8; --ae-action-ink: #1A1730;
  --ae-success: #4FD69A; --ae-success-soft: rgba(79,214,154,.16);
  --ae-warn: #F0A94E; --ae-warn-soft: rgba(240,169,78,.16);
  --ae-danger: #FF7B85; --ae-danger-soft: rgba(255,123,133,.16);
  --ae-info: #C9C4F5; --ae-info-soft: rgba(201,196,245,.14);
  --ae-shadow-1: 0 1px 2px rgba(0,0,0,.35); --ae-shadow-2: 0 6px 18px rgba(0,0,0,.40); --ae-shadow-pop: 0 12px 32px rgba(0,0,0,.50);
  --ae-logo-ink: #FFFFFF; --ae-produto: #C9C4F5;
  --t0-bg: rgba(201,196,245,.16); --t0-ink: #D6D2F8;
  --t1-bg: rgba(250,140,36,.18);  --t1-ink: #FCC69A;
  --t2-bg: rgba(255,3,143,.20);   --t2-ink: #FF9BD0;
  --t3-bg: rgba(79,214,154,.16);  --t3-ink: #7FE3B6;
  --t4-bg: rgba(255,212,0,.16);   --t4-ink: #FCDD51;
  --t5-bg: rgba(110,168,255,.18); --t5-ink: #A9CBFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 14px/1.5 var(--ae-font); color: var(--ae-text); background: var(--ae-bg); min-height: 100vh; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ae-pink); outline-offset: 2px; }
.fita { height: 4px; background: var(--ae-gradiente); }
.rotulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ae-text-faint); }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.ae-logo { display: inline-flex; color: var(--ae-logo-ink); height: 24px; min-width: 130px; flex: none; }
.ae-logo svg { display: block; height: 100%; width: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--ae-radius-sm); border: 1px solid var(--ae-border-strong); background: var(--ae-surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--ae-surface-2); }
.btn--primario { background: var(--ae-action); border-color: var(--ae-action); color: var(--ae-action-ink); font-weight: 600; }
.btn--primario:hover { background: var(--ae-action-hover); border-color: var(--ae-action-hover); }
.btn--fantasma { border-color: transparent; background: transparent; color: var(--ae-text-soft); }
.btn[disabled] { opacity: .6; cursor: progress; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo input, .campo select, .ctrl { min-height: 38px; padding: 0 10px; border-radius: var(--ae-radius-sm); border: 1px solid var(--ae-border-strong); background: var(--ae-surface); width: 100%; }

/* ---------- login ---------- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ae-gradiente-diagonal); }
.login__card { width: min(400px, 100%); background: var(--ae-surface); border-radius: var(--ae-radius-lg); box-shadow: var(--ae-shadow-pop); padding: 32px 28px 28px; }
.login__logo { margin-bottom: 28px; min-height: 24px; }
.login__card h1 { margin: 0 0 4px; font-size: 23px; font-weight: 900; letter-spacing: -.022em; color: var(--ae-brand); }
.login__card p { margin: 0 0 20px; color: var(--ae-text-soft); }
.login__card form { display: grid; gap: 14px; }
.login__card .btn { min-height: 42px; margin-top: 4px; }
.aviso { padding: 10px 12px; border-radius: var(--ae-radius-sm); background: var(--ae-danger-soft); color: var(--ae-danger); font-weight: 500; }

/* ---------- cabeçalho ---------- */
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 24px 40px; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 16px; padding: 16px 0 18px; }
.cab__marca { display: flex; align-items: center; gap: 12px; width: 100%; padding-bottom: 10px; min-height: 34px; }
.cab__sep { width: 1px; height: 22px; background: var(--ae-border-strong); }
.cab__produto { color: var(--ae-produto); letter-spacing: .08em; font-size: 13px; text-transform: uppercase; }
.cab__produto b { font-weight: 800; }
.cab h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.022em; color: var(--ae-brand); line-height: 1.2; }
.cab p { margin: 4px 0 0; color: var(--ae-text-soft); font-size: 13px; }
.cab__acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- indicadores (também filtram por situação) ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { text-align: left; background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); padding: 12px 16px 12px; box-shadow: var(--ae-shadow-1); display: grid; gap: 2px; position: relative; overflow: hidden; }
.kpi:hover { border-color: var(--ae-border-strong); }
.kpi b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; color: var(--ae-brand); }
.kpi small { color: var(--ae-text-soft); font-size: 12px; }
.kpi[aria-pressed="true"] { border-color: var(--ae-brand); box-shadow: var(--ae-shadow-2); }
.kpi[aria-pressed="true"]::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: var(--ae-gradiente); }

/* ---------- barra de filtros ---------- */
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); padding: 10px; box-shadow: var(--ae-shadow-1); }
.busca { position: relative; flex: 1 1 260px; min-width: 200px; }
.busca svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ae-text-faint); }
.busca input { padding-left: 34px; }
.barra select.ctrl { width: auto; flex: 0 0 auto; max-width: 280px; }
.barra .empurra { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--ae-border-strong); border-radius: var(--ae-radius-sm); overflow: hidden; }
.seg button { border: 0; background: var(--ae-surface); min-height: 36px; padding: 0 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ae-brand); color: var(--ae-surface); font-weight: 600; }
.conta { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--ae-action); color: var(--ae-action-ink); font-size: 11px; font-weight: 700; }
.mais { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-items: end; padding: 14px 4px 4px; width: 100%; border-top: 1px solid var(--ae-border); margin-top: 2px; }
.linha { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 2px 12px; color: var(--ae-text-soft); min-height: 28px; }
.linha b { color: var(--ae-text); font-weight: 800; }
.ativo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--ae-info-soft); color: var(--ae-info); font-size: 12px; font-weight: 600; border: 0; }
.ativo span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ae-surface); font-size: 13px; line-height: 1; }
.link { background: none; border: 0; padding: 0; color: var(--ae-pink-ink); font-weight: 600; }

/* ---------- etiquetas ---------- */
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--t0-bg); color: var(--t0-ink); font-size: 11.5px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.5; }
.chip--t1 { background: var(--t1-bg); color: var(--t1-ink); } .chip--t2 { background: var(--t2-bg); color: var(--t2-ink); }
.chip--t3 { background: var(--t3-bg); color: var(--t3-ink); } .chip--t4 { background: var(--t4-bg); color: var(--t4-ink); }
.chip--t5 { background: var(--t5-bg); color: var(--t5-ink); }
.chip--etapa { background: var(--ae-surface-2); color: var(--ae-text); display: inline-flex; align-items: center; gap: 6px; }
.chip--etapa i { width: 8px; height: 8px; border-radius: 50%; background: var(--cor, var(--ae-border-strong)); flex: none; }
.chip--S { background: var(--ae-success-soft); color: var(--ae-success); }
.chip--F { background: var(--ae-danger-soft); color: var(--ae-danger); }
.pri { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; line-height: 1.5; white-space: nowrap; background: var(--ae-surface-2); color: var(--ae-text-soft); }
.pri b { display: inline-grid; place-items: center; min-width: 16px; height: 16px; border-radius: 4px; background: currentColor; font-size: 10.5px; font-weight: 800; }
.pri b span { color: var(--ae-surface); }
.pri--1 { background: var(--ae-danger-soft); color: var(--ae-danger); }
.pri--2 { background: var(--t1-bg); color: var(--t1-ink); }
.pri--3 { background: var(--t4-bg); color: var(--t4-ink); }
.pri--4 { background: var(--t5-bg); color: var(--t5-ink); }
.sla { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ae-text-soft); white-space: nowrap; }
.venc { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 700; line-height: 1.5; white-space: nowrap; background: var(--ae-success-soft); color: var(--ae-success); }
.venc--atrasado { background: var(--ae-danger-soft); color: var(--ae-danger); }
.venc--hoje, .venc--perto { background: var(--ae-warn-soft); color: var(--ae-warn); }
.venc--suspenso { background: var(--ae-surface-2); color: var(--ae-text-soft); }
.card__prazo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.card__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.duo p { margin: 6px 0 0; color: var(--ae-text-soft); font-size: 13px; line-height: 1.55; }
.duo strong { display: block; margin-top: 6px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; color: var(--ae-brand); }
.legenda { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.legenda li { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start; color: var(--ae-text-soft); font-size: 13.5px; }
.lista-simples { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.linha .direita { margin-left: auto; }
.avatar { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ae-info-soft); color: var(--ae-info); font-size: 10px; font-weight: 800; flex: none; letter-spacing: .02em; }

/* ---------- kanban ---------- */
.kanban { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 14px; align-items: flex-start; scroll-snap-type: x proximity; }
.col { flex: 0 0 312px; background: var(--ae-surface-2); border-radius: var(--ae-radius); max-height: calc(100vh - 120px); display: flex; flex-direction: column; scroll-snap-align: start; }
.col__cab { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
.col__cab i { width: 10px; height: 10px; border-radius: 50%; background: var(--cor, var(--ae-border-strong)); flex: none; }
.col__cab h2 { margin: 0; font-size: 13px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col__n { font-weight: 800; background: var(--ae-surface); border-radius: 999px; padding: 0 9px; font-size: 12px; line-height: 22px; }
.col__lista { padding: 4px 8px 10px; display: grid; gap: 8px; overflow-y: auto; }
.col--vazia { flex: 0 0 44px; align-items: center; padding: 12px 0; gap: 10px; opacity: .8; }
.col--vazia h2 { writing-mode: vertical-rl; font-size: 12px; font-weight: 600; color: var(--ae-text-soft); margin: 0; white-space: nowrap; }
.col--vazia i { width: 10px; height: 10px; border-radius: 50%; background: var(--cor, var(--ae-border-strong)); }
.col__mais { margin: 2px 0 0; }
.kanban--unica .col { flex: 1 1 auto; max-height: none; }
.kanban--unica .col__lista { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); overflow: visible; align-items: start; }
.kanban--unica .col__mais { grid-column: 1 / -1; justify-self: center; }

.card { text-align: left; width: 100%; background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: 10px; padding: 12px 14px 11px; box-shadow: var(--ae-shadow-1); display: grid; gap: 9px; transition: box-shadow .12s, border-color .12s, transform .12s; }
.card:hover { border-color: var(--ae-border-strong); box-shadow: var(--ae-shadow-2); transform: translateY(-1px); }
.card__topo { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card__id { color: var(--ae-text-faint); font-size: 12px; flex: none; }
.card__titulo { font-size: 14px; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.card__nota { display: flex; gap: 6px; align-items: flex-start; background: var(--ae-warn-soft); color: var(--ae-warn); border-radius: 6px; padding: 6px 8px; font-size: 12px; font-weight: 500; line-height: 1.4; }
.card__nota span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card__nota svg { margin-top: 2px; }
.card__pessoas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 9px; border-top: 1px solid var(--ae-border); }
.card__pessoa { display: grid; gap: 3px; min-width: 0; }
.card__pessoa small { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ae-text-faint); }
.card__pessoa span { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 500; }
.card__pessoa span span:not(.avatar) { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card__pessoa .avatar { width: 22px; height: 22px; font-size: 9.5px; }
.avatar--equipe { background: var(--ae-pink-soft); color: var(--ae-pink-ink); }
.card__rodape { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ae-text-soft); font-size: 12px; }
.card__quem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card__info { display: inline-flex; align-items: center; gap: 4px; flex: none; }

/* ---------- lista ---------- */
.tabela-wrap { background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); overflow-x: auto; box-shadow: var(--ae-shadow-1); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 0; border-bottom: 1px solid var(--ae-border); white-space: nowrap; }
th button { all: unset; cursor: pointer; display: flex; gap: 4px; align-items: center; padding: 11px 12px; width: 100%; box-sizing: border-box; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ae-text-faint); }
th button:hover, th[aria-sort] button { color: var(--ae-text); }
td { padding: 11px 12px; border-bottom: 1px solid var(--ae-border); vertical-align: top; }
td.t-titulo { min-width: 280px; max-width: 520px; }
td.t-titulo div { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-weight: 500; }
td.nowrap { white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--ae-surface-2); }
tbody tr:last-child td { border-bottom: 0; }

.estado { text-align: center; padding: 56px 16px; color: var(--ae-text-soft); background: var(--ae-surface); border: 1px dashed var(--ae-border-strong); border-radius: var(--ae-radius); }
.estado strong { display: block; color: var(--ae-brand); font-size: 16px; font-weight: 800; margin-bottom: 4px; }

/* ---------- detalhe ---------- */
dialog.gaveta { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(640px, 100vw); max-width: 100vw; border: 0; padding: 0; background: var(--ae-bg); color: var(--ae-text); box-shadow: var(--ae-shadow-pop); }
dialog.gaveta::backdrop { background: rgba(23, 20, 40, .5); }
.gav__cab { position: sticky; top: 0; background: var(--ae-surface); padding: 14px 24px 16px; border-bottom: 1px solid var(--ae-border); z-index: 1; }
.gav__linha { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.gav__linha div { display: flex; gap: 4px; }
.gav__cab h2 { margin: 0 0 10px; font-size: 19px; font-weight: 800; letter-spacing: -.015em; line-height: 1.35; overflow-wrap: anywhere; }
.gav__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.progresso { margin-top: 14px; }
.progresso__txt { display: flex; justify-content: space-between; font-size: 12px; color: var(--ae-text-soft); margin-bottom: 6px; }
.etapas { display: flex; gap: 3px; }
.etapas i { flex: 1; height: 6px; border-radius: 3px; background: var(--ae-surface-3); }
.etapas i.on { background: var(--ae-pink); }
.etapas.ok i { background: var(--ae-success); }
.gav__corpo { padding: 18px 24px 40px; display: grid; gap: 14px; }
.bloco { background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); padding: 16px 18px; }
.bloco > .rotulo { display: block; margin-bottom: 8px; }
.bloco--alerta { background: var(--ae-warn-soft); border-color: transparent; }
.bloco--alerta > .rotulo, .bloco--alerta .texto { color: var(--ae-warn); }
.bloco--ok { border-left: 4px solid var(--ae-success); }
.dados { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin: 0; }
.dados div { min-width: 0; }
.dados dd { margin: 3px 0 0; font-weight: 500; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
a { color: var(--ae-pink-ink); }
.texto { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 14.5px; line-height: 1.65; }
.coment { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--ae-border); }
.coment:first-of-type { border-top: 0; padding-top: 2px; }
.coment .avatar { width: 28px; height: 28px; font-size: 11px; }
.coment__cab { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ae-text-soft); margin-bottom: 3px; }
.coment__cab b { color: var(--ae-text); font-weight: 600; font-size: 13px; }
.rodape { margin-top: 28px; color: var(--ae-text-faint); font-size: 12px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ae-brand); color: var(--ae-surface); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; box-shadow: var(--ae-shadow-pop); z-index: 99; }

@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  .wrap { padding: 0 14px 32px; }
  .cab h1 { font-size: 22px; }
  .cab__acoes { width: 100%; }
  .barra select.ctrl { flex: 1 1 100%; max-width: none; }
  .barra .empurra select.ctrl { flex: 1 1 auto; }
  .barra .empurra { margin-left: 0; width: 100%; justify-content: space-between; }
  .col { flex-basis: 84vw; max-height: none; }
  .col__lista { overflow: visible; }
  .dados, .duo { grid-template-columns: 1fr; }
  .legenda li { grid-template-columns: 1fr; gap: 4px; }
  .gav__cab, .gav__corpo { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }

<script>

// ---------- acesso aos dados ----------
async function arquivoDe(login) {
  const h = await crypto.subtle.digest('SHA-256', enc.encode('ae-painel:file:' + login));
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 40);

async function baixar(login) {
  const r = await fetch(`data/${await arquivoDe(login)}.json?t=${Date.now()}`, { cache: 'no-store' });

async function entrar(login, senha) {

  try {
    const chave = await crypto.subtle.importKey('raw', b64(salvo.k), 'AES-GCM', true, ['decrypt']);
    dados = await abrir(await baixar(salvo.login), chave);
    sessao = { login: salvo.login, chave };

}

  const d = dados.deals.find((x) => x.id === Number(id));
  if (!d) return;
  const s = etapaDe(d.stage);
  const andamento = dados.stages.filter((x) => x.sem === 'P');
  const pos = andamento.findIndex((x) => x.id === d.stage);
  const nota = notaDe(d);
  const longo = (v) => typeof v === 'string' && (v.length > 70 || v.includes('\n'));
  const marcados = dados.fields.filter((f) => f.type === 'boolean' && d.v[f.code] === 'Sim');
  const curtos = dados.fields.filter((f) => d.v[f.code] !== undefined && !longo(d.v[f.code]) && f.code !== dados.noteField && f.type !== 'boolean');
  const longos = dados.fields.filter((f) => d.v[f.code] !== undefined && longo(d.v[f.code]) && f.code !== dados.noteField);
  const item = (rot, html) => (html ? `<div><dt class="rotulo">${esc(rot)}</dt><dd>${html}</dd></div>` : '');
  const pessoa = (nome, equipe) => (nome ? `<span class="avatar${equipe ? ' avatar--equipe' : ''}" aria-hidden="true">${esc(iniciais(nome))}</span>${esc(nome)}` : '');
  const progresso = s.sem === 'S'
    ? `<div class="progresso"><div class="progresso__txt"><span>Chamado concluído</span></div><div class="etapas ok"><i></i></div></div>`
    : s.sem === 'P' && pos >= 0
      ? `<div class="progresso"><div class="progresso__txt"><span>Etapa ${pos + 1} de ${andamento.length}</span><span>${pos + 1 < andamento.length ? 'Próxima: ' + esc(andamento[pos + 1].name) : ''}</span></div>
         <div class="etapas" aria-hidden="true">${andamento.map((_, i) => `<i class="${i <= pos ? 'on' : ''}"></i>`).join('')}</div></div>` : '';
  const descExtra = d.desc && d.desc.trim() !== d.title.trim();
  $('#gaveta').innerHTML = `
    <div class="gav__cab">
      <div class="gav__linha"><span class="rotulo num">Chamado #${d.id}</span>
        <div><button class="btn btn--fantasma" type="button" data-copiar="${d.id}">Copiar link</button><button class="btn" type="button" data-fechar>Fechar</button></div></div>
      <h2 id="gav-titulo">${esc(d.title)}</h2>
      <div class="gav__chips">${chipEtapa(s)}${chipTipo(d)}${marcados.map((f) => `<span class="chip chip--t1">${esc(f.label)}</span>`).join('')}</div>
      ${progresso}
    </div>
    <div class="gav__corpo">
      ${nota ? `<section class="bloco bloco--alerta"><span class="rotulo">${esc(dados.fields.find((f) => f.code === dados.noteField)?.label || 'Atenção')}</span><p class="texto">${esc(nota)}</p></section>` : ''}
      ${nivel(d) || d.sla ? `<section class="bloco"><div class="duo">
        ${nivel(d) ? `<div><span class="rotulo">${esc(dados.priority.label)}</span><div style="margin-top:6px">${priHtml(d)}</div><p>${esc(nivel(d).desc)}</p></div>` : ''}
        ${d.sla ? `<div><span class="rotulo">Prazo estimado (SLA)</span><strong>${esc(slaTexto(d.sla))}</strong>
          ${vencimento(d) ? `<div style="margin-top:8px">${vencHtml(d)}</div><p>${esc(vencimento(d).longo)}${d.sla.pausedDays ? ` O prazo já ficou suspenso por ${d.sla.pausedDays} ${d.sla.pausedDays === 1 ? 'dia útil' : 'dias úteis'}.` : ''}</p>` : ''}
          <p>${esc([d.sla.type, d.sla.size].filter(Boolean).join(' de '))}${d.sla.note ? '. ' + esc(d.sla.note) : d.sla.pending ? '. O prazo é definido quando o porte da demanda for classificado.' : '.'}</p></div>` : ''}
      </div><p style="margin:12px 0 0"><button class="link" type="button" data-regras>Entenda prioridades e prazos</button></p></section>` : ''}
      <section class="bloco"><dl class="dados">
        ${item('Solicitante', pessoa(d.contact))}
        ${item('Responsável', pessoa(d.assigned, true))}
        ${item('Aberto em', esc(data(d.created, true)))}
        ${item('Última atualização', esc(data(d.modified, true)))}
        ${curtos.filter((f) => f.code !== dados.cardField).map((f) => item(f.label, valor(f, d.v[f.code]))).join('')}
      </dl></section>
      ${descExtra ? `<section class="bloco"><span class="rotulo">Pedido</span><p class="texto">${esc(d.desc)}</p></section>` : ''}
      ${longos.map((f) => `<section class="bloco${s.sem === 'S' ? ' bloco--ok' : ''}"><span class="rotulo">${esc(f.label)}</span><p class="texto">${valor(f, d.v[f.code])}</p></section>`).join('')}
      <section class="bloco"><span class="rotulo">Comentários (${d.comments.length})</span>
        ${d.comments.map((c) => `<div class="coment"><span class="avatar" aria-hidden="true">${esc(iniciais(c.a))}</span><div>
            <div class="coment__cab"><b>${esc(c.a)}</b><span class="num" title="${esc(data(c.d, true))}">${esc(relativo(c.d))}</span></div><p class="texto">${esc(c.t)}</p></div></div>`).join('')
          || '<p class="texto" style="color:var(--ae-text-soft)">Ainda não há comentários neste chamado.</p>'}
      </section>
    </div>`;
  const g = $('#gaveta');
  if (!g.open) g.showModal();
  g.scrollTop = 0;
  if (!semHash) history.replaceState(null, '', '#chamado=' + d.id);
}
function abrirRegras() {
  const p = dados.priority, s = dados.sla;
  $('#gaveta').innerHTML = `
    <div class="gav__cab">
      <div class="gav__linha"><span class="rotulo">Como funciona</span><div><button class="btn" type="button" data-fechar>Fechar</button></div></div>
      <h2 id="gav-titulo" style="margin:0">Prioridades e prazos</h2>
    </div>
    <div class="gav__corpo">
      ${p ? `<section class="bloco"><span class="rotulo">Regra de priorização</span>
        <p class="texto" style="margin-bottom:14px;font-size:13.5px;color:var(--ae-text-soft)">Cada chamado é classificado pela importância e pela urgência. A fila de atendimento segue esta ordem:</p>
        <ul class="legenda">${Object.entries(p.levels).map(([n, l]) => `<li><span><span class="pri pri--${esc(n)}"><b><span>${esc(n)}</span></b>${esc(l.short)}</span></span><span>${esc(l.desc)}</span></li>`).join('')}</ul></section>` : ''}
      ${s && s.legend.length ? `<section class="bloco"><span class="rotulo">Prazos estimados (SLA)</span>
        <ul class="lista-simples">${s.legend.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
        ${s.footnote ? `<p class="texto" style="margin-top:12px;font-size:13px;color:var(--ae-text-soft)">${esc(s.footnote)}</p>` : ''}</section>` : ''}
    </div>`;
  const g = $('#gaveta');
  if (!g.open) g.showModal();
  g.scrollTop = 0;
}
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  t.setAttribute('role', 'status');
  ($('#gaveta').open ? $('#gaveta') : document.body).append(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- telas ----------
function mostrarLogin() {
  $('#logo-login').append($('#logo'));
  $('#app').hidden = true; $('#login').hidden = false;
  $('#in-senha').value = '';
  $('#in-login').focus();
}
function mostrarApp() {
  $('#logo-app').append($('#logo'));
  $('#login').hidden = true; $('#app').hidden = false;
  filtros.situacao = dados.deals.some((d) => etapaDe(d.stage).sem === 'P') ? 'P' : '';
  cabecalho(); montarBarra(); render();
  const m = location.hash.match(/^#chamado=(\d+)$/);
  if (m) abrirChamado(m[1], true);
}
function tema(t) {
  document.documentElement.dataset.tema = t;
  $('#btn-tema').textContent = t === 'escuro' ? 'Tema claro' : 'Tema escuro';
  guardar('ae-painel-tema', t);
}

// ---------- eventos ----------
$('#form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#btn-entrar'), erro = $('#login-erro');
  erro.hidden = true; btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await entrar(normLogin($('#in-login').value), $('#in-senha').value);
    mostrarApp();
  } catch (err) {
    erro.textContent = err.message === 'credenciais' ? 'Login ou senha inválidos.' : 'Não foi possível carregar os dados agora. Tente novamente em instantes.';
    erro.hidden = false;
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
$('#barra').addEventListener('input', (e) => {
  if (e.target.id === 'ordem') { ordem = e.target.value; ordemLista = null; render(); return; }
  aplicarFiltro(e.target);
  if (e.target.tagName === 'SELECT' || e.target.type === 'date') montarBarra();
});
$('#barra').addEventListener('click', (e) => {
  const v = e.target.closest('[data-visao]');
  if (v) { visao = v.dataset.visao; guardar('ae-painel-visao', visao); montarBarra(); render(); return; }
  if (e.target.closest('#btn-mais')) { maisAberto = !maisAberto; montarBarra(); }
});
$('#kpis').addEventListener('click', (e) => {
  const k = e.target.closest('[data-sit]');
  if (!k) return;
  filtros.situacao = k.dataset.sit;
  for (const c in limite) delete limite[c];
  render();
});
$('#linha').addEventListener('click', (e) => {
  if (e.target.closest('#btn-regras')) { abrirRegras(); return; }
  const b = e.target.closest('[data-limpar]');
  if (!b) return;
  const k = b.dataset.limpar;
  if (k === '*') Object.assign(filtros, { q: '', contato: '', resp: '', prazo: '', pri: '', desde: '', campos: {} });
  else if (k.startsWith('c:')) filtros.campos[k.slice(2)] = ''; else filtros[k] = '';
  montarBarra(); render();
});
$('#conteudo').addEventListener('click', (e) => {
  const mais = e.target.closest('[data-mais]');
  if (mais) { const k = mais.dataset.mais; limite[k] = (limite[k] || (k === 'lista' ? 100 : POR_COLUNA)) + (k === 'lista' ? 100 : POR_COLUNA); render(); return; }
  const ord = e.target.closest('[data-ordenar]');
  if (ord) { const c = ord.dataset.ordenar; ordemLista = ordemLista?.col === c ? { col: c, dir: -ordemLista.dir } : { col: c, dir: 1 }; render(); return; }
  const el = e.target.closest('[data-id]');
  if (el) abrirChamado(el.dataset.id);
});
$('#conteudo').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-id]')) abrirChamado(e.target.dataset.id); });
$('#gaveta').addEventListener('click', async (e) => {
  if (e.target === e.currentTarget || e.target.closest('[data-fechar]')) { e.currentTarget.close(); return; }
  if (e.target.closest('[data-regras]')) { abrirRegras(); return; }
  const c = e.target.closest('[data-copiar]');
  if (c) {
    const url = location.href.split('#')[0] + '#chamado=' + c.dataset.copiar;
    try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch { toast(url); }
  }
});
$('#gaveta').addEventListener('close', () => history.replaceState(null, '', location.pathname + location.search));
$('#btn-atualizar').addEventListener('click', () => atualizar(true));
$('#btn-tema').addEventListener('click', () => tema(document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro'));
$('#btn-sair').addEventListener('click', sair);
setInterval(() => atualizar(false), 5 * 60 * 1000);

(async () => {
  tema(ler('ae-painel-tema') === 'escuro' ? 'escuro' : 'claro');
  if (await retomar()) mostrarApp(); else mostrarLogin();
})();
</script>
</body>
</html>
