<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suporte | Advocacia Escalável</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
  --ae-gradiente: linear-gradient(90deg, #2B2B6E 0%, #FF038F 100%);
  --ae-gradiente-diagonal: linear-gradient(135deg, #2B2B6E 0%, #FF038F 100%);
  --ae-r2: #534C8C; --ae-r4: #C9C4F5;
  --ae-font: "Geologica", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
  --ae-radius-lg: 16px; --ae-radius: 10px; --ae-radius-sm: 8px;
}
:root, [data-tema="claro"] {
  --ae-bg: #F6F5FA; --ae-surface: #FFFFFF; --ae-surface-2: #EFEDF6; --ae-surface-3: #E7E4F2;
  --ae-border: #E1DEEE; --ae-border-strong: #C9C4F5;
  --ae-text: #2E294F; --ae-text-soft: #5B5878; --ae-text-faint: #6B6885;
  --ae-brand: #2B2B6E; --ae-pink: #FF038F; --ae-pink-ink: #C70070; --ae-pink-soft: #FFE6F3;
  --ae-action: #C70070; --ae-action-hover: #A80260; --ae-action-ink: #FFFFFF;
  --ae-success: #147A5C; --ae-success-soft: #E3F4EE;
  --ae-danger: #B23A20; --ae-danger-soft: #FBEAE5;
  --ae-info: #534C8C; --ae-info-soft: #ECEAF8;
  --ae-shadow-1: 0 1px 2px rgba(43,43,110,.06), 0 1px 3px rgba(43,43,110,.05);
  --ae-shadow-2: 0 4px 16px rgba(43,43,110,.10);
  --ae-shadow-pop: 0 12px 32px rgba(43,43,110,.16);
  --ae-logo-ink: #2B2B6E; --ae-produto: #534C8C;
  color-scheme: light;
}
[data-tema="escuro"] {
  --ae-bg: #171428; --ae-surface: #211E39; --ae-surface-2: #2E294F; --ae-surface-3: #3A3460;
  --ae-border: #3D3862; --ae-border-strong: #534C8C;
  --ae-text: #F3F1F8; --ae-text-soft: #B7B4C8; --ae-text-faint: #9895B0;
  --ae-brand: #C9C4F5; --ae-pink: #FF038F; --ae-pink-ink: #FF69B8; --ae-pink-soft: rgba(255,3,143,.18);
  --ae-action: #FF69B8; --ae-action-hover: #FF8CC8; --ae-action-ink: #1A1730;
  --ae-success: #4FD69A; --ae-success-soft: rgba(79,214,154,.16);
  --ae-danger: #FF7B85; --ae-danger-soft: rgba(255,123,133,.16);
  --ae-info: #C9C4F5; --ae-info-soft: rgba(201,196,245,.14);
  --ae-shadow-1: 0 1px 2px rgba(0,0,0,.35); --ae-shadow-2: 0 4px 16px rgba(0,0,0,.40); --ae-shadow-pop: 0 12px 32px rgba(0,0,0,.50);
  --ae-logo-ink: #FFFFFF; --ae-produto: #C9C4F5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 14px/1.5 var(--ae-font); color: var(--ae-text); background: var(--ae-bg); min-height: 100vh; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ae-pink); outline-offset: 2px; }
.fita { height: 4px; background: var(--ae-gradiente); }
.rotulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ae-text-faint); }
.num { font-variant-numeric: tabular-nums; }

.ae-logo { display: inline-flex; color: var(--ae-logo-ink); height: 24px; min-width: 130px; flex: none; }
.ae-logo svg { display: block; height: 100%; width: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--ae-radius-sm); border: 1px solid var(--ae-border-strong); background: var(--ae-surface); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--ae-surface-2); }
.btn--primario { background: var(--ae-action); border-color: var(--ae-action); color: var(--ae-action-ink); font-weight: 600; }
.btn--primario:hover { background: var(--ae-action-hover); border-color: var(--ae-action-hover); }
.btn[disabled] { opacity: .6; cursor: progress; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo input, .campo select { min-height: 36px; padding: 0 10px; border-radius: var(--ae-radius-sm); border: 1px solid var(--ae-border-strong); background: var(--ae-surface); width: 100%; }

/* ---------- login ---------- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ae-gradiente-diagonal); }
.login__card { width: min(400px, 100%); background: var(--ae-surface); border-radius: var(--ae-radius-lg); box-shadow: var(--ae-shadow-pop); padding: 32px 28px 28px; }
.login__logo { margin-bottom: 28px; min-height: 24px; }
.login__card h1 { margin: 0 0 4px; font-size: 23px; font-weight: 900; letter-spacing: -.022em; color: var(--ae-brand); }
.login__card p { margin: 0 0 20px; color: var(--ae-text-soft); }
.login__card form { display: grid; gap: 14px; }
.login__card .btn { min-height: 42px; margin-top: 4px; }
.aviso { padding: 10px 12px; border-radius: var(--ae-radius-sm); background: var(--ae-danger-soft); color: var(--ae-danger); font-weight: 500; }

/* ---------- app ---------- */
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 24px 40px; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 18px 0 16px; border-bottom: 1px solid var(--ae-border); margin-bottom: 16px; }
.cab__marca { display: flex; align-items: center; gap: 12px; width: 100%; padding-bottom: 14px; min-height: 38px; }
.cab__sep { width: 1px; height: 22px; background: var(--ae-border-strong); }
.cab__produto { color: var(--ae-produto); letter-spacing: .08em; font-size: 13px; text-transform: uppercase; }
.cab__produto b { font-weight: 800; }
.cab h1 { margin: 0; font-size: 23px; font-weight: 900; letter-spacing: -.022em; color: var(--ae-brand); }
.cab p { margin: 2px 0 0; color: var(--ae-text-soft); }
.cab__acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--ae-border-strong); border-radius: var(--ae-radius-sm); overflow: hidden; }
.seg button { border: 0; background: var(--ae-surface); min-height: 34px; padding: 0 14px; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ae-brand); color: var(--ae-surface); font-weight: 600; }

.filtros { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; align-items: end; background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); padding: 14px; box-shadow: var(--ae-shadow-1); }
.filtros .campo--busca { grid-column: span 2; }
.resumo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 2px 10px; color: var(--ae-text-soft); }
.resumo b { color: var(--ae-text); font-weight: 800; }
.link { background: none; border: 0; padding: 0; color: var(--ae-pink-ink); font-weight: 600; cursor: pointer; }

.kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { flex: 0 0 290px; background: var(--ae-surface-2); border-radius: var(--ae-radius); border-top: 4px solid var(--cor, var(--ae-border-strong)); max-height: calc(100vh - 150px); display: flex; flex-direction: column; }
.col__cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px 8px; }
.col__cab h2 { margin: 0; font-size: 13px; font-weight: 700; }
.col__n { font-weight: 800; background: var(--ae-surface); border-radius: 999px; padding: 0 9px; font-size: 12px; line-height: 22px; }
.col__lista { padding: 4px 8px 10px; display: grid; gap: 8px; overflow-y: auto; }
.col__vazio { padding: 14px 8px; text-align: center; color: var(--ae-text-faint); font-size: 13px; }
.card { text-align: left; width: 100%; background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius-sm); padding: 10px 12px; cursor: pointer; box-shadow: var(--ae-shadow-1); display: grid; gap: 6px; }
.card:hover { border-color: var(--ae-border-strong); box-shadow: var(--ae-shadow-2); }
.card__topo { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--ae-text-faint); font-size: 12px; }
.card__titulo { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.card__meta { display: flex; justify-content: space-between; gap: 8px; color: var(--ae-text-soft); font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--ae-info-soft); color: var(--ae-info); font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip--S { background: var(--ae-success-soft); color: var(--ae-success); }
.chip--F { background: var(--ae-danger-soft); color: var(--ae-danger); }

.tabela-wrap { background: var(--ae-surface); border: 1px solid var(--ae-border); border-radius: var(--ae-radius); overflow-x: auto; box-shadow: var(--ae-shadow-1); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--ae-border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--ae-border); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--ae-surface-2); }
tbody tr:last-child td { border-bottom: 0; }

.estado { text-align: center; padding: 56px 16px; color: var(--ae-text-soft); background: var(--ae-surface); border: 1px dashed var(--ae-border-strong); border-radius: var(--ae-radius); }
.estado strong { display: block; color: var(--ae-brand); font-size: 16px; font-weight: 800; margin-bottom: 4px; }

dialog.gaveta { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(560px, 100vw); max-width: 100vw; border: 0; padding: 0; background: var(--ae-surface); color: var(--ae-text); box-shadow: var(--ae-shadow-pop); }
dialog.gaveta::backdrop { background: rgba(23, 20, 40, .45); }
.gav__cab { position: sticky; top: 0; background: var(--ae-surface); padding: 18px 24px 14px; border-bottom: 1px solid var(--ae-border); z-index: 1; }
.gav__linha { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.gav__cab h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.015em; overflow-wrap: anywhere; }
.gav__corpo { padding: 18px 24px 32px; display: grid; gap: 22px; }
.etapas { display: flex; gap: 3px; margin-top: 12px; }
.etapas i { flex: 1; height: 5px; border-radius: 3px; background: var(--ae-surface-3); }
.etapas i.on { background: var(--ae-pink); }
.dados { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin: 0; }
.dados div { min-width: 0; }
.dados dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.dados a { color: var(--ae-pink-ink); }
.texto { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
.coment { border-left: 3px solid var(--ae-border-strong); padding: 2px 0 2px 12px; margin-top: 12px; }
.coment__cab { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ae-text-soft); }
.coment__cab b { color: var(--ae-text); font-weight: 600; }
.rodape { margin-top: 28px; color: var(--ae-text-faint); font-size: 12px; text-align: center; }

@media (max-width: 700px) {
  .wrap { padding: 0 14px 32px; }
  .cab__acoes { width: 100%; }
  .filtros .campo--busca { grid-column: 1 / -1; }
  .col { flex-basis: 82vw; }
  .dados { grid-template-columns: 1fr; }
}
</style>
</head>

    <h1>Painel de suporte</h1>
    <p>Acompanhe os chamados do seu escritório.</p>
    <form id="form-login" autocomplete="on">
      <label class="campo"><span class="rotulo">Login do escritório</span>
        <input id="in-login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="campo"><span class="rotulo">Senha</span>
        <input id="in-senha" name="password" type="password" autocomplete="current-password" required></label>
      <div class="aviso" id="login-erro" role="alert" hidden></div>
      <button class="btn btn--primario" id="btn-entrar" type="submit">Entrar</button>
    </form>
  </div>
</main>

<div id="app" hidden>
  <div class="fita"></div>
  <div class="wrap">
    <header class="cab">
      <div class="cab__marca">
        <span id="logo-app"></span>
        <span class="cab__sep" aria-hidden="true"></span>
        <span class="cab__produto">PAINEL <b id="produto">SUPORTE</b></span>
      </div>
      <div>
        <h1 id="escritorio"></h1>
        <p id="atualizado"></p>
      </div>
      <div class="cab__acoes">
        <div class="seg" role="group" aria-label="Visualização">
          <button type="button" data-visao="kanban">Kanban</button>
          <button type="button" data-visao="lista">Lista</button>
        </div>
        <button class="btn" type="button" id="btn-tema">Tema escuro</button>
        <button class="btn" type="button" id="btn-sair">Sair</button>
      </div>
    </header>

    <section class="filtros" id="filtros" aria-label="Filtros"></section>
    <div class="resumo"><span id="contagem"></span><button class="link" type="button" id="btn-limpar" hidden>Limpar filtros</button></div>
    <section id="conteudo" aria-live="polite"></section>
    <p class="rodape">Somente consulta. Para abrir ou complementar um chamado, use o canal de suporte habitual.</p>
  </div>
</div>

<dialog class="gaveta" id="gaveta" aria-labelledby="gav-titulo"></dialog>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SESSAO = 'ae-painel-sessao';
const enc = new TextEncoder();
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const normLogin = (s) => s.trim().toLowerCase();

let dados = null;
let sessao = null;
let visao = localStorage.getItem('ae-painel-visao') === 'lista' ? 'lista' : 'kanban';
const filtros = { q: '', contato: '', situacao: '', desde: '', campos: {} };

// ---------- acesso aos dados ----------
async function arquivoDe(login) {
  const h = await crypto.subtle.digest('SHA-256', enc.encode('ae-painel:file:' + login));
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 40);
}
async function baixar(login) {
  const r = await fetch(`data/${await arquivoDe(login)}.json?t=${Date.now()}`, { cache: 'no-store' });
  if (r.status === 404) throw new Error('credenciais');
  if (!r.ok) throw new Error('rede');
  return r.json();
}
async function derivar(senha, env) {
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(env.salt), iterations: env.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function abrir(env, chave) {
  let claro;
  try { claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, chave, b64(env.ct)); }
  catch { throw new Error('credenciais'); }
  const texto = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(texto);
}

// ---------- sessão ----------
async function entrar(login, senha) {
  const env = await baixar(login);
  const chave = await derivar(senha, env);
  dados = await abrir(env, chave);
  sessao = { login, chave };
  try { sessionStorage.setItem(SESSAO, JSON.stringify({ login, k: toB64(await crypto.subtle.exportKey('raw', chave)) })); } catch {}
}
async function retomar() {
  let salvo;
  try { salvo = JSON.parse(sessionStorage.getItem(SESSAO)); } catch {}
  if (!salvo) return false;
  try {
    const chave = await crypto.subtle.importKey('raw', b64(salvo.k), 'AES-GCM', true, ['decrypt']);
    dados = await abrir(await baixar(salvo.login), chave);
    sessao = { login: salvo.login, chave };
    return true;
  } catch { try { sessionStorage.removeItem(SESSAO); } catch {} return false; }
}
function sair() {
  try { sessionStorage.removeItem(SESSAO); } catch {}
  dados = null; sessao = null;
  mostrarLogin();
}
async function atualizar() {
  if (!sessao || document.hidden) return;
  try {
    dados = await abrir(await baixar(sessao.login), sessao.chave);
    montarFiltros(); render();
  } catch (e) { if (e.message === 'credenciais') sair(); }
}

// ---------- formatação ----------
const fData = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fHora = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function data(v, comHora) {
  if (!v) return '';
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T12:00:00' : v);
  return isNaN(d) ? String(v) : (comHora ? fHora : fData).format(d);
}
function valor(campo, v) {
  const um = (x) => {
    if (campo.type === 'date') return esc(data(x));
    if (campo.type === 'datetime') return esc(data(x, true));
    if (campo.type === 'url' && /^https?:\/\//i.test(x)) return `<a href="${esc(x)}" target="_blank" rel="noopener noreferrer">${esc(x)}</a>`;
    return esc(x);
  };
  return Array.isArray(v) ? v.map(um).join(', ') : um(v);
}
const cor = (c) => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '');
const etapaDe = (id) => dados.stages.find((s) => s.id === id) || { id, name: 'Outros', sem: 'P', color: '' };

// ---------- filtros ----------
function opcoes(valores) {
  return [...new Set(valores.flat().filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR'));
}
function select(id, rotulo, lista, atual) {
  return `<label class="campo"><span class="rotulo">${esc(rotulo)}</span><select data-f="${esc(id)}">
    <option value="">Todos</option>${lista.map((o) => `<option${o === atual ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
}
function montarFiltros() {
  const camposFiltro = dados.fields.filter((f) => f.filter);
  const sit = [['', 'Todas'], ['P', 'Em andamento'], ['S', 'Concluídos'], ['F', 'Cancelados']];
  $('#filtros').innerHTML = `
    <label class="campo campo--busca"><span class="rotulo">Buscar</span>
      <input type="search" data-f="q" placeholder="Título, número ou texto do chamado" value="${esc(filtros.q)}"></label>
    ${select('contato', 'Solicitante', opcoes(dados.deals.map((d) => d.contact)), filtros.contato)}
    <label class="campo"><span class="rotulo">Situação</span><select data-f="situacao">
      ${sit.map(([v, t]) => `<option value="${v}"${v === filtros.situacao ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
    ${camposFiltro.map((f) => {
      const lista = opcoes(dados.deals.map((d) => d.v[f.code] ?? []));
      return lista.length ? select('c:' + f.code, f.label, lista, filtros.campos[f.code] || '') : '';
    }).join('')}
    <label class="campo"><span class="rotulo">Criado a partir de</span><input type="date" data-f="desde" value="${esc(filtros.desde)}"></label>`;
}
function aplicarFiltro(el) {
  const k = el.dataset.f;
  if (!k) return;
  if (k.startsWith('c:')) filtros.campos[k.slice(2)] = el.value; else filtros[k] = el.value;
  render();
}
function filtrados() {
  const q = filtros.q.trim().toLowerCase();
  const desde = filtros.desde ? new Date(filtros.desde + 'T00:00:00').getTime() : 0;
  return dados.deals.filter((d) => {
    if (filtros.contato && d.contact !== filtros.contato) return false;
    if (filtros.situacao && etapaDe(d.stage).sem !== filtros.situacao) return false;
    if (desde && new Date(d.created).getTime() < desde) return false;
    for (const [code, v] of Object.entries(filtros.campos)) if (v && ![].concat(d.v[code] ?? []).includes(v)) return false;
    if (q) {
      const alvo = [d.id, d.title, d.contact, d.desc, ...Object.values(d.v).flat(), ...d.comments.map((c) => c.t)].join(' ').toLowerCase();
      if (!alvo.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => new Date(b.modified) - new Date(a.modified));
}
const temFiltro = () => !!(filtros.q || filtros.contato || filtros.situacao || filtros.desde || Object.values(filtros.campos).some(Boolean));

// ---------- render ----------
function chipTipo(d) {
  const v = d.v[dados.cardField];
  return v ? `<span class="chip">${esc([].concat(v).join(', '))}</span>` : '';
}
function render() {
  const lista = filtrados();
  const total = dados.deals.length;
  $('#contagem').innerHTML = lista.length === total
    ? `<b class="num">${total}</b> ${total === 1 ? 'chamado' : 'chamados'}`
    : `<b class="num">${lista.length}</b> de <span class="num">${total}</span> chamados`;
  $('#btn-limpar').hidden = !temFiltro();
  document.querySelectorAll('[data-visao]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.visao === visao)));
  const alvo = $('#conteudo');

  if (!total) { alvo.innerHTML = `<div class="estado"><strong>Nenhum chamado por aqui</strong>Quando seu escritório abrir um pedido de suporte, ele aparece neste painel.</div>`; return; }
  if (!lista.length) { alvo.innerHTML = `<div class="estado"><strong>Nenhum chamado com esses filtros</strong>Ajuste ou limpe os filtros para ver mais resultados.</div>`; return; }

  if (visao === 'kanban') {
    const etapas = [...dados.stages];
    for (const d of lista) if (!etapas.some((s) => s.id === d.stage)) etapas.push(etapaDe(d.stage));
    alvo.innerHTML = `<div class="kanban">${etapas.filter((s) => !filtros.situacao || s.sem === filtros.situacao).map((s) => {
      const itens = lista.filter((d) => d.stage === s.id);
      return `<section class="col" style="--cor:${cor(s.color)}">
        <div class="col__cab"><h2>${esc(s.name)}</h2><span class="col__n num">${itens.length}</span></div>
        <div class="col__lista">${itens.map((d) => `
          <button class="card" type="button" data-id="${d.id}">
            <span class="card__topo"><span class="num">#${d.id}</span>${chipTipo(d)}</span>
            <span class="card__titulo">${esc(d.title)}</span>
            <span class="card__meta"><span>${esc(d.contact || 'Sem solicitante')}</span><span class="num">${esc(data(d.created))}</span></span>
            ${d.comments.length ? `<span class="card__meta"><span>${d.comments.length} ${d.comments.length === 1 ? 'comentário' : 'comentários'}</span></span>` : ''}
          </button>`).join('') || '<div class="col__vazio">Sem chamados</div>'}</div>
      </section>`;
    }).join('')}</div>`;
  } else {
    alvo.innerHTML = `<div class="tabela-wrap"><table>
      <thead><tr>${['Nº', 'Chamado', 'Etapa', 'Tipo', 'Solicitante', 'Criado', 'Atualizado'].map((h) => `<th class="rotulo">${h}</th>`).join('')}</tr></thead>
      <tbody>${lista.map((d) => { const s = etapaDe(d.stage); return `<tr data-id="${d.id}" tabindex="0">
        <td class="num">#${d.id}</td><td><b>${esc(d.title)}</b></td>
        <td><span class="chip chip--${esc(s.sem)}">${esc(s.name)}</span></td><td>${chipTipo(d)}</td>
        <td>${esc(d.contact)}</td><td class="num">${esc(data(d.created))}</td><td class="num">${esc(data(d.modified, true))}</td></tr>`; }).join('')}</tbody>
    </table></div>`;
  }
}

function abrirChamado(id) {
  const d = dados.deals.find((x) => x.id === Number(id));
  if (!d) return;
  const s = etapaDe(d.stage);
  const andamento = dados.stages.filter((x) => x.sem !== 'F');
  const pos = andamento.findIndex((x) => x.id === d.stage);
  const item = (rot, html) => (html ? `<div><dt class="rotulo">${esc(rot)}</dt><dd>${html}</dd></div>` : '');
  $('#gaveta').innerHTML = `
    <div class="gav__cab">
      <div class="gav__linha"><span class="rotulo num">Chamado #${d.id}</span><button class="btn" type="button" data-fechar>Fechar</button></div>
      <h2 id="gav-titulo">${esc(d.title)}</h2>
      <div style="margin-top:8px"><span class="chip chip--${esc(s.sem)}">${esc(s.name)}</span></div>
      ${s.sem !== 'F' && pos >= 0 ? `<div class="etapas" aria-hidden="true">${andamento.map((_, i) => `<i class="${i <= pos ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    </div>
    <div class="gav__corpo">
      <dl class="dados">
        ${item('Solicitante', esc(d.contact))}
        ${item('Responsável', esc(d.assigned))}
        ${item('Criado em', esc(data(d.created, true)))}
        ${item('Última atualização', esc(data(d.modified, true)))}
        ${dados.fields.map((f) => (d.v[f.code] !== undefined ? item(f.label, valor(f, d.v[f.code])) : '')).join('')}
      </dl>
      ${d.desc ? `<section><span class="rotulo">Descrição</span><p class="texto">${esc(d.desc)}</p></section>` : ''}
      <section><span class="rotulo">Comentários (${d.comments.length})</span>
        ${d.comments.map((c) => `<div class="coment"><div class="coment__cab"><b>${esc(c.a)}</b><span class="num">${esc(data(c.d, true))}</span></div><p class="texto">${esc(c.t)}</p></div>`).join('')
          || '<p class="texto" style="color:var(--ae-text-soft)">Ainda não há comentários neste chamado.</p>'}
      </section>
    </div>`;
  const g = $('#gaveta');
  if (!g.open) g.showModal();
  g.scrollTop = 0;
}

// ---------- telas ----------
function mostrarLogin() {
  $('#logo-login').append($('#logo'));
  $('#app').hidden = true; $('#login').hidden = false;
  $('#in-senha').value = '';
  $('#in-login').focus();
}
function mostrarApp() {
  $('#logo-app').append($('#logo'));
  $('#login').hidden = true; $('#app').hidden = false;
  $('#escritorio').textContent = dados.office.name;
  $('#produto').textContent = dados.product;
  $('#atualizado').textContent = 'Dados atualizados em ' + data(dados.generatedAt, true);
  document.title = `${dados.product} | ${dados.office.name}`;
  montarFiltros(); render();
}
function tema(t) {
  document.documentElement.dataset.tema = t;
  $('#btn-tema').textContent = t === 'escuro' ? 'Tema claro' : 'Tema escuro';
  try { localStorage.setItem('ae-painel-tema', t); } catch {}
}

// ---------- eventos ----------
$('#form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#btn-entrar'), erro = $('#login-erro');
  erro.hidden = true; btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    await entrar(normLogin($('#in-login').value), $('#in-senha').value);
    mostrarApp();
  } catch (err) {
    erro.textContent = err.message === 'credenciais' ? 'Login ou senha inválidos.' : 'Não foi possível carregar os dados agora. Tente novamente em instantes.';
    erro.hidden = false;
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});
$('#filtros').addEventListener('input', (e) => aplicarFiltro(e.target));
$('#btn-limpar').addEventListener('click', () => { Object.assign(filtros, { q: '', contato: '', situacao: '', desde: '', campos: {} }); montarFiltros(); render(); });
$('#conteudo').addEventListener('click', (e) => { const el = e.target.closest('[data-id]'); if (el) abrirChamado(el.dataset.id); });
$('#conteudo').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('tr[data-id]')) abrirChamado(e.target.dataset.id); });
$('#gaveta').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.closest('[data-fechar]')) e.currentTarget.close(); });
document.querySelectorAll('[data-visao]').forEach((b) => b.addEventListener('click', () => { visao = b.dataset.visao; try { localStorage.setItem('ae-painel-visao', visao); } catch {} render(); }));
$('#btn-tema').addEventListener('click', () => tema(document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro'));
$('#btn-sair').addEventListener('click', sair);
setInterval(atualizar, 5 * 60 * 1000);

(async () => {
  let t = 'claro';
  try { t = localStorage.getItem('ae-painel-tema') === 'escuro' ? 'escuro' : 'claro'; } catch {}
  tema(t);
  if (await retomar()) mostrarApp(); else mostrarLogin();
})();
</script>
</body>
</html>
