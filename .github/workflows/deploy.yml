name: Publicar painel

on:
  push:
    branches: [main]
  schedule:
    # Rede de segurança: o agendamento do GitHub é "melhor esforço" e pula a maioria das execuções.
    # Quem garante o ritmo de 15 min é o job "proxima", que redispara este workflow ao final de cada execução.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # para o job "proxima" disparar a execução seguinte

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar dados criptografados
        run: node scripts/build.mjs
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          OFFICES_JSON: ${{ secrets.OFFICES_JSON }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Job separado: publicar no mesmo job do upload falha às vezes com
  # "No artifacts named github-pages were found" (o artefato ainda não está visível).
  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Mantém o ciclo: espera ~14 min e dispara a próxima execução deste mesmo workflow.
  # Roda mesmo se a geração falhar (ex.: Bitrix24 fora do ar), para a cadeia não morrer.
  # Para interromper: cancele a execução em andamento ou desative o workflow na aba Actions.
  proxima:
    needs: publicar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Aguardar o próximo ciclo
        run: sleep 840
      - name: Disparar a próxima atualização
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
